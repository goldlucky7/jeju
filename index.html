<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 여행 스탬프북 — 관광지·맛집·카페 59선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0E7490; --sea-deep:#155E6B;
    --tangerine:#F2762E; --canola:#F5C542;
    --basalt:#26302E; --paper:#F7FAF9; --card:#FFFFFF;
    --stamp:#D6362B; --line:#DCE7E5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--basalt);line-height:1.6;}
  header{
    background:linear-gradient(160deg,var(--sea-deep) 0%,var(--sea) 60%,#1E8FA5 100%);
    color:#fff;padding:44px 20px 30px;position:relative;overflow:hidden;
  }
  header::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:26px;
    background:radial-gradient(circle at 10px -6px, transparent 14px, var(--paper) 15px);
    background-size:40px 26px;}
  .h-eyebrow{font-size:13px;letter-spacing:4px;color:var(--canola);font-weight:700;margin-bottom:8px;}
  h1{font-family:'Gowun Batang',serif;font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:-1px;}
  h1 .dot{color:var(--tangerine);}
  .h-sub{margin-top:10px;font-size:14px;opacity:.92;max-width:600px;}
  .progress-wrap{margin:22px auto 6px;max-width:680px;background:rgba(255,255,255,.16);border-radius:999px;padding:5px;}
  .progress-bar{height:14px;border-radius:999px;width:0%;
    background:linear-gradient(90deg,var(--canola),var(--tangerine));
    transition:width .5s cubic-bezier(.22,1,.36,1);min-width:14px;}
  .progress-label{text-align:center;font-size:13px;margin-top:8px;font-weight:500;}
  .progress-label b{color:var(--canola);font-size:16px;}
  nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:22px 16px 6px;position:sticky;top:0;background:rgba(247,250,249,.94);backdrop-filter:blur(6px);z-index:10;border-bottom:1px solid var(--line);}
  .tab{border:1.5px solid var(--line);background:#fff;color:var(--basalt);
    padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;
    transition:all .18s;font-family:inherit;}
  .tab:hover{border-color:var(--sea);}
  .tab.active{background:var(--basalt);color:#fff;border-color:var(--basalt);}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
  .section-title{font-family:'Gowun Batang',serif;font-size:22px;margin:26px 4px 12px;
    display:flex;align-items:center;gap:10px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    position:relative;display:flex;flex-direction:column;transition:transform .18s, box-shadow .18s;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(21,94,107,.12);}
  .card.visited{border-color:#F0C9C5;background:#FFFDFB;}
  .visual{height:104px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;}
  .v-spot{background:linear-gradient(135deg,#B7E6EE,#4FA9BC);}
  .v-food{background:linear-gradient(135deg,#FFDCC2,#F2925C);}
  .v-cafe{background:linear-gradient(135deg,#EFE6CE,#C9B77F);}
  .badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:900;letter-spacing:1px;
    padding:3px 10px;border-radius:999px;color:#fff;}
  .b-spot{background:var(--sea);} .b-food{background:var(--tangerine);} .b-cafe{background:#8A7742;}
  .region{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;
    background:rgba(255,255,255,.85);padding:3px 10px;border-radius:999px;color:var(--basalt);}
  .body{padding:16px 16px 14px;flex:1;display:flex;flex-direction:column;}
  .name{font-family:'Gowun Batang',serif;font-size:19px;font-weight:700;margin-bottom:2px;}
  .tagline{font-size:12.5px;color:var(--sea-deep);font-weight:700;margin-bottom:6px;}
  .hash{font-size:11.5px;color:#8B9693;margin-bottom:8px;font-weight:500;}
  .desc{font-size:13.5px;color:#4A5553;margin-bottom:10px;}
  .meta{font-size:12.5px;color:#5C6664;border-top:1px dashed var(--line);padding-top:9px;margin-top:auto;}
  .meta div{display:flex;gap:6px;margin-bottom:3px;}
  .meta .ico{flex-shrink:0;}
  .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .links a{font-size:12px;font-weight:700;text-decoration:none;padding:5px 11px;border-radius:8px;
    border:1px solid var(--line);color:var(--sea-deep);transition:all .15s;}
  .links a:hover{background:var(--sea);color:#fff;border-color:var(--sea);}
  .visit-btn{margin-top:12px;width:100%;padding:10px;border-radius:10px;
    border:1.5px dashed #C9CFCE;background:#F6F8F8;
    font-family:inherit;font-size:14px;font-weight:700;color:#6B7573;cursor:pointer;transition:all .18s;}
  .visit-btn:hover{border-color:var(--stamp);color:var(--stamp);}
  .card.visited .visit-btn{background:#FBEDEB;border:1.5px solid #EFC5C0;color:var(--stamp);}
  .stamp{position:absolute;top:50px;right:14px;width:86px;height:86px;border-radius:50%;
    border:3.5px solid var(--stamp);color:var(--stamp);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:900;font-size:13px;letter-spacing:1px;
    transform:rotate(-14deg) scale(0);opacity:0;pointer-events:none;
    background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(214,54,43,.25);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .2s;z-index:2;}
  .stamp .chk{font-size:26px;line-height:1;}
  .card.visited .stamp{transform:rotate(-14deg) scale(1);opacity:.92;}
  @media (prefers-reduced-motion: reduce){.card,.stamp,.progress-bar{transition:none;}}
  footer{text-align:center;font-size:12px;color:#7C8684;padding:26px 16px 40px;border-top:1px solid var(--line);}
  footer a{color:var(--sea-deep);}
  .reset{margin-top:10px;background:none;border:none;font-size:12px;color:#9AA3A1;
    text-decoration:underline;cursor:pointer;font-family:inherit;}
  .cpl-btn{font-family:inherit;font-size:12.5px;font-weight:700;margin:0 3px 6px;
    background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.45);
    border-radius:999px;padding:6px 14px;cursor:pointer;transition:background .15s;}
  .cpl-btn:hover{background:rgba(255,255,255,.32);}
  .bk-btn{font-family:inherit;font-size:12.5px;font-weight:700;margin:0 4px;
    background:#fff;color:var(--sea-deep);border:1.5px solid var(--line);
    border-radius:999px;padding:7px 16px;cursor:pointer;transition:all .15s;}
  .bk-btn:hover{border-color:var(--sea);background:var(--sea);color:#fff;}
  /* 장소 추가 버튼(플로팅) & 입력창 */
  #fabAdd{position:fixed;right:16px;bottom:20px;z-index:50;
    background:var(--tangerine);color:#fff;border:none;border-radius:999px;
    padding:14px 20px;font-family:inherit;font-size:15px;font-weight:900;
    box-shadow:0 6px 18px rgba(242,118,46,.4);cursor:pointer;}
  #addModal{position:fixed;inset:0;background:rgba(20,30,28,.55);z-index:60;
    display:none;align-items:center;justify-content:center;padding:20px;}
  #addModal.open{display:flex;}
  .modal-box{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:400px;}
  .modal-box h3{font-family:'Gowun Batang',serif;font-size:20px;margin-bottom:14px;}
  .modal-box input,.modal-box select{width:100%;margin-bottom:10px;padding:11px 12px;
    border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;}
  .modal-box input:focus,.modal-box select:focus{outline:none;border-color:var(--sea);}
  .modal-actions{display:flex;gap:8px;margin-top:6px;}
  .modal-actions button{flex:1;padding:12px;border-radius:10px;font-family:inherit;
    font-size:14px;font-weight:700;cursor:pointer;}
  #np_cancel{background:#F1F4F3;border:1.5px solid var(--line);color:#5C6664;}
  #np_save{background:var(--tangerine);border:none;color:#fff;}
  .del-link{font-size:11.5px;color:#B8514A;text-decoration:underline;background:none;
    border:none;cursor:pointer;font-family:inherit;margin-top:6px;}
</style>
</head>
<body>

<header>
  <div style="max-width:1080px;margin:0 auto;">
    <div class="h-eyebrow">JEJU STAMP BOOK · 59 PLACES</div>
    <h1>제주 여행 스탬프북<span class="dot">.</span></h1>
    <p class="h-sub">감성 포토스팟부터 액티비티, 자연 명소, 노포 맛집까지 —
    20대부터 40대까지 모두를 위한 59곳. 다녀온 곳은 <b>[갔다왔음]</b>을 눌러 빨간 도장을 찍어보세요.</p>
    <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
    <div class="progress-label" id="plabel"></div>
    <div style="text-align:center;margin-top:12px;">
      <div id="syncstate" style="font-size:12px;opacity:.9;"></div>
    </div>
  </div>
</header>

<nav id="tabs">
  <button class="tab active" data-filter="all">전체</button>
  <button class="tab" data-filter="spot">🏝 관광지</button>
  <button class="tab" data-filter="food">🍽 맛집</button>
  <button class="tab" data-filter="cafe">☕ 카페</button>
  <button class="tab" data-filter="visited">🔴 갔다온 곳</button>
</nav>

<main id="list"></main>

<button id="fabAdd">➕ 장소 추가</button>

<div id="addModal">
  <div class="modal-box">
    <h3>📌 우리만의 장소 추가</h3>
    <input id="np_name" placeholder="장소 이름 (필수) 예: OO식당">
    <select id="np_cat">
      <option value="spot">🏝 관광지</option>
      <option value="food">🍽 맛집</option>
      <option value="cafe">☕ 카페</option>
    </select>
    <input id="np_region" placeholder="지역 (선택) 예: 서부·애월">
    <input id="np_addr" placeholder="주소 (선택)">
    <input id="np_memo" placeholder="메모 (선택) 예: 인스타에서 봄, 웨이팅 있음">
    <div class="modal-actions">
      <button id="np_cancel">취소</button>
      <button id="np_save">추가하기</button>
    </div>
  </div>
</div>

<footer>
  💡 <b>같이 쓰는 법</b>: 링크를 상대방에게 보내기만 하면 끝!
  <b>로그인도, 코드 입력도 없이</b> 같은 링크로 여는 모든 기기의 도장이 자동으로 합쳐집니다.<br>
  주소·운영시간·요금은 조사 시점 기준이며 변동될 수 있으니 방문 전 확인을 권장합니다.<br>
  공식 여행정보: <a href="https://www.visitjeju.net" target="_blank">비짓제주 (제주관광공사)</a><br>
  <div style="margin-top:12px;">
    <button class="bk-btn" id="backupBtn">💾 기록 백업 (복사)</button>
    <button class="bk-btn" id="restoreBtn">♻️ 기록 복원</button>
  </div>
  <button class="reset" id="resetBtn">방문 기록 전체 초기화</button>
</footer>

 {id:"saebyeol",cat:"spot",emoji:"🌄",region:"서부·애월",name:"새별오름",tag:"억새와 노을의 오름",hash:"#전연령 #노을 #가을억새",

const CAT = {spot:{label:"관광지"},food:{label:"맛집"},cafe:{label:"카페"}};

// ===== 저장 구조: {v: 방문 도장, c: 직접 추가한 장소} — 두 사람이 자동 공유 =====
const COUPLE_KEY = "jejustamp_3c5491d5379e4abce2a377bae7987b6c";
const READ_URL  = "https://textdb.online/" + COUPLE_KEY;
const WRITE_URL = "https://textdb.online/update";
const KEY = "jeju_data_v2";
let visited = {};
let customPlaces = [];
let online = false;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function normalize(data){
  if(!data || typeof data !== "object") return {v:{}, c:[]};
  if(data.v || data.c) return {v: data.v || {}, c: Array.isArray(data.c) ? data.c : []};
  return {v: data, c: []}; // 예전 형식(도장만 있던 시절) 자동 변환
}
function mergeCustom(a, b){ // 직접 추가한 장소 합치기 (중복 제거)
  const seen = {}; const out = [];
  [].concat(a||[], b||[]).forEach(p=>{
    if(p && p.id && !seen[p.id]){ seen[p.id]=1; out.push(p); }
  });
  return out;
}

async function fetchRemote(){
  const res = await fetch(READ_URL + "?t=" + Date.now(), {cache:"no-store"});
  const txt = await res.text();
  if(!txt || !txt.trim()) return {v:{}, c:[]};
  try{ return normalize(JSON.parse(txt)); }catch(e){ return {v:{}, c:[]}; }
}
async function pushRemote(){
  const body = "key=" + encodeURIComponent(COUPLE_KEY) +
               "&value=" + encodeURIComponent(JSON.stringify({v:visited, c:customPlaces}));
  const res = await fetch(WRITE_URL, {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: body
  });
  if(!res.ok) throw new Error("save fail");
}
function saveLocal(){ lsSet(KEY, JSON.stringify({v:visited, c:customPlaces})); }

function updateSyncLabel(){
  const el = document.getElementById("syncstate");
  if(!el) return;
  el.textContent = online
    ? "🔗 자동 연동 중 · 도장과 추가한 장소가 두 사람에게 함께 저장됩니다"
    : "📱 오프라인 · 인터넷 연결 시 자동으로 다시 연동됩니다";
}

// 도장 찍기: 최신 기록에 내 변경만 얹어 저장 (덮어쓰기 방지)
async function toggleVisit(id){
  const newVal = !visited[id];
  visited[id] = newVal;
  render();
  try{
    let latest = {v:visited, c:customPlaces};
    try{ latest = await fetchRemote(); }catch(e){}
    if(newVal) latest.v[id] = true; else delete latest.v[id];
    visited = latest.v;
    customPlaces = mergeCustom(latest.c, customPlaces);
    await pushRemote();
    saveLocal(); online = true;
    render(); updateSyncLabel();
  }catch(e){ online = false; saveLocal(); updateSyncLabel(); }
}

// 장소 추가: 두 사람 모두에게 자동 반영
async function addCustomPlace(p){
  customPlaces = customPlaces.concat([p]);
  render();
  try{
    let latest = {v:visited, c:[]};
    try{ latest = await fetchRemote(); }catch(e){}
    visited = Object.assign({}, latest.v, visited);
    customPlaces = mergeCustom(latest.c, customPlaces);
    await pushRemote();
    saveLocal(); online = true;
    render(); updateSyncLabel();
  }catch(e){ online = false; saveLocal(); updateSyncLabel(); }
}

// 직접 추가한 장소 삭제
async function deleteCustomPlace(id){
  if(!confirm("이 장소를 목록에서 삭제할까요? (두 사람 모두에게서 지워집니다)")) return;
  customPlaces = customPlaces.filter(p=>p.id!==id);
  delete visited[id];
  render();
  try{
    let latest = {v:visited, c:customPlaces};
    try{ latest = await fetchRemote(); }catch(e){}
    latest.c = latest.c.filter(p=>p.id!==id);
    delete latest.v[id];
    visited = latest.v;
    customPlaces = mergeCustom(latest.c, customPlaces.filter(p=>p.id!==id));
    await pushRemote();
    saveLocal(); online = true;
    render(); updateSyncLabel();
  }catch(e){ online = false; saveLocal(); updateSyncLabel(); }
}

// 자동 갱신: 10초마다 + 화면 복귀 시 (상대방의 도장·추가 장소 반영)
async function autoSync(){
  try{
    const latest = await fetchRemote();
    online = true;
    const now = JSON.stringify({v:visited, c:customPlaces});
    const remote = JSON.stringify(latest);
    if(remote !== now){
      visited = latest.v;
      customPlaces = latest.c;
      saveLocal();
      render();
    }
    updateSyncLabel();
  }catch(e){ online = false; updateSyncLabel(); }
}

const list = document.getElementById("list");
let currentFilter = "all";

function customToCard(p){
  return {
    id: p.id, cat: p.cat || "spot", emoji: "📌",
    region: p.region || "직접 추가",
    name: p.name,
    tag: "우리가 직접 추가한 곳",
    hash: p.memo ? ("📝 " + p.memo) : "",
    desc: p.memo || "가보고 싶어서 직접 추가한 장소예요.",
    addr: p.addr || "주소 미입력",
    time: "방문 전 운영시간 확인",
    links: [["네이버지도", NM(p.name)]],
    custom: true
  };
}
function allPlaces(){
  return PLACES.concat(customPlaces.map(customToCard));
}

function render(){
  list.innerHTML = "";
  const pool = allPlaces();
  ["spot","food","cafe"].forEach(cat=>{
    const items = pool.filter(p=>{
      if(currentFilter==="visited") return p.cat===cat && visited[p.id];
      if(currentFilter!=="all" && currentFilter!==cat) return false;
      return p.cat===cat;
    });
    if(items.length===0) return;
    const title = document.createElement("h2");
    title.className="section-title";
    title.textContent = (cat==="spot"?"🏝 ":cat==="food"?"🍽 ":"☕ ")+CAT[cat].label+" ("+items.length+")";
    list.appendChild(title);
    const grid = document.createElement("div");
    grid.className="grid";
    items.forEach(p=>grid.appendChild(makeCard(p)));
    list.appendChild(grid);
  });
  if(currentFilter==="visited" && !pool.some(p=>visited[p.id])){
    list.innerHTML = '<p style="text-align:center;padding:60px 20px;color:#7C8684;">아직 찍은 도장이 없어요.<br>다녀온 곳의 <b>[갔다왔음]</b> 버튼을 눌러보세요!</p>';
  }
  updateProgress();
}

function makeCard(p){
  const c = document.createElement("article");
  c.className = "card"+(visited[p.id]?" visited":"");
  c.innerHTML = `
    <div class="visual v-${p.cat}">
      <span>${p.emoji}</span>
      <span class="badge b-${p.cat}">${CAT[p.cat].label}</span>
      <span class="region">${p.region}</span>
    </div>
    <div class="stamp"><span class="chk">✔</span>방문완료</div>
    <div class="body">
      <div class="name">${p.name}</div>
      <div class="tagline">${p.tag}</div>
      <div class="hash">${p.hash}</div>
      <p class="desc">${p.desc}</p>
      <div class="meta">
        <div><span class="ico">📍</span><span>${p.addr}</span></div>
        <div><span class="ico">🕐</span><span>${p.time}</span></div>
      </div>
      <div class="links">
        ${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("")}
      </div>
      <button class="visit-btn" aria-pressed="${!!visited[p.id]}">
        ${visited[p.id]?"✔ 갔다왔음 (다시 누르면 취소)":"갔다왔음 도장 찍기"}
      </button>
      ${p.custom?'<button class="del-link">이 장소 삭제</button>':""}
    </div>`;
  c.querySelector(".visit-btn").addEventListener("click",()=>{ toggleVisit(p.id); });
  const del = c.querySelector(".del-link");
  if(del) del.addEventListener("click",()=>{ deleteCustomPlace(p.id); });
  return c;
}

function updateProgress(){
  const pool = allPlaces();
  const total = pool.length;
  const done = pool.filter(p=>visited[p.id]).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("pbar").style.width = pct+"%";
  document.getElementById("plabel").innerHTML =
    `전체 <b>${total}</b>곳 중 <b>${done}</b>곳 방문 · 달성률 <b>${pct}%</b>`;
}

document.getElementById("tabs").addEventListener("click",e=>{
  const btn = e.target.closest(".tab");
  if(!btn) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  currentFilter = btn.dataset.filter;
  render();
});

// ===== 장소 추가 입력창 =====
const modal = document.getElementById("addModal");
document.getElementById("fabAdd").addEventListener("click",()=>{ modal.classList.add("open"); });
document.getElementById("np_cancel").addEventListener("click",()=>{ modal.classList.remove("open"); });
modal.addEventListener("click",e=>{ if(e.target===modal) modal.classList.remove("open"); });
document.getElementById("np_save").addEventListener("click",()=>{
  const name = document.getElementById("np_name").value.trim();
  if(!name){ alert("장소 이름을 입력해주세요!"); return; }
  const p = {
    id: "cust_" + Date.now(),
    name: name,
    cat: document.getElementById("np_cat").value,
    region: document.getElementById("np_region").value.trim(),
    addr: document.getElementById("np_addr").value.trim(),
    memo: document.getElementById("np_memo").value.trim()
  };
  ["np_name","np_region","np_addr","np_memo"].forEach(i=>document.getElementById(i).value="");
  modal.classList.remove("open");
  addCustomPlace(p);
});

// ===== 기록 백업 / 복원 =====
document.getElementById("backupBtn").addEventListener("click",()=>{
  const names = allPlaces().filter(p=>visited[p.id]).map(p=>p.name).join(", ");
  const data = "JEJU-BACKUP|" + JSON.stringify({v:visited, c:customPlaces});
  const doneMsg = "백업 완료! 카톡 '나에게 보내기'나 메모장에 붙여넣어 보관하세요.\n\n다녀온 곳: " + (names || "아직 없음");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(
      ()=>alert(doneMsg),
      ()=>prompt("아래 내용을 길게 눌러 전체 복사한 뒤 메모장에 보관하세요:", data)
    );
  }else{
    prompt("아래 내용을 길게 눌러 전체 복사한 뒤 메모장에 보관하세요:", data);
  }
});

document.getElementById("restoreBtn").addEventListener("click",async ()=>{
  const raw = prompt("보관해둔 백업 내용을 붙여넣으세요:");
  if(!raw) return;
  try{
    const json = raw.trim().replace(/^JEJU-BACKUP\|/, "");
    const data = normalize(JSON.parse(json));
    visited = Object.assign({}, visited, data.v);
    customPlaces = mergeCustom(customPlaces, data.c);
    saveLocal();
    try{ await pushRemote(); online = true; }catch(e){ online = false; }
    render(); updateSyncLabel();
    alert("복원 완료! 도장 " + Object.keys(visited).filter(k=>visited[k]).length + "개를 되살렸어요.");
  }catch(e){
    alert("백업 내용을 읽을 수 없어요. 복사한 내용이 잘렸는지 확인해주세요.");
  }
});

document.getElementById("resetBtn").addEventListener("click",async ()=>{
  if(confirm("모든 방문 도장을 지울까요? (연동 중이면 두 사람 모두 지워지며, 추가한 장소는 남습니다)")){
    visited = {};
    saveLocal();
    try{ await pushRemote(); }catch(e){}
    render();
  }
});

(async function init(){
  const raw = lsGet(KEY) || lsGet("jeju_visited"); // 예전 저장분도 인식
  if(raw){ try{ const d = normalize(JSON.parse(raw)); visited=d.v; customPlaces=d.c; }catch(e){} }
  render();
  await autoSync();  // 열자마자 최신 공유 기록 반영
  setInterval(autoSync, 10000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) autoSync(); });
  window.addEventListener("focus", autoSync);
})();
</script>
